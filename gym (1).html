
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY HEALTH</title>
  <link rel = "icon" href="WhatsApp Image 2026-05-11 at 10.55.35 AM.jpeg">
  <style>
    /* ── CSS Variables ── */
    :root {
      --bg:          #e8f0ec;
      --bg2:         #f4f9f6;
      --card:        #ffffff;
      --text:        #1a2e2a;
      --text-muted:  #4a6b5f;
      --border:      #c3ddd3;
      --green:       #3ecf8e;
      --blue:        #3b9eff;
      --teal:        #2bc4b4;
      --grad:        linear-gradient(135deg, #3ecf8e 0%, #3b9eff 100%);
      --grad-soft:   linear-gradient(135deg, #a8f0d8 0%, #b8dcff 100%);
      --shadow:      0 4px 20px rgba(60,160,120,.15);
      --shadow-lg:   0 8px 40px rgba(60,160,120,.25);
      --radius:      16px;
      --transition:  .3s ease;
    }
    [data-theme="dark"] {
      --bg:          #0f1e1a;
      --bg2:         #162620;
      --card:        #1e342c;
      --text:        #d4f0e4;
      --text-muted:  #7ab89a;
      --border:      #2a4a3a;
      --shadow:      0 4px 20px rgba(0,0,0,.4);
      --shadow-lg:   0 8px 40px rgba(0,0,0,.6);
    }
    .var1 {
        background-color: rgb(0, 71, 171);
        position: fixed;
        bottom:0;
        left: 0;
        width :100%;
        z-index: 1000;
        box-shadow: 0 -2px 5px rgba (0,0,0,0.2);
        border-radius: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;

       }
       .var1 a { 
        padding: 8px 16px;
        background-color: rgb(102,191,42);
       }
     

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 48px 20px 0;
    }
    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 6vw, 5rem);
      letter-spacing: .08em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    header .tagline {
      font-size: .95rem;
      color: var(--text-muted);
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .hero-wrapper {
      width: 100%;
      max-height: 480px;
      overflow: hidden;
      border-radius: var(--radius);
      border: 3px solid transparent;
      background: var(--grad);
      padding: 3px;
      box-shadow: var(--shadow-lg);
    }
    .hero-wrapper img {
      width: 100%;
      height: 100%;
      max-height: 474px;
      object-fit: cover;
      border-radius: calc(var(--radius) - 3px);
      display: block;
    }

    /* ── Main ── */
    main {
      max-width: 1300px;
      margin: 0 auto;
      padding: 40px 24px 120px;
    }

    /* ── Section headings ── */
    .section-label {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }
    .section-label h2 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: .06em;
      color: var(--text);
    }
    .section-label span.line {
      flex: 1;
      height: 2px;
      background: var(--grad-soft);
      border-radius: 2px;
    }

    /* ── Equipment Grid ── */
    #home-page { animation: fadeIn .4s ease; }

    .equipment-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }
    @media (max-width: 900px)  { .equipment-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 580px)  { .equipment-grid { grid-template-columns: 1fr; } }

    /* ── Card ── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow);
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
      position: relative;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--teal);
    }

    /* Tooltip on hover */
    .card::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) scale(.92);
      background: var(--grad);
      color: #fff;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .06em;
      padding: 7px 14px;
      border-radius: 8px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(62,207,142,.35);
    }
    .card:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    .card-img-wrap {
      width: 100%;
      height: 220px;
      overflow: hidden;
      position: relative;
    }
    .card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .45s ease;
    }
    .card:hover .card-img-wrap img { transform: scale(1.07); }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(11,40,30,.55) 0%, transparent 60%);
    }
    .card-body {
      padding: 16px 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-body h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.3;
    }
    .card-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--grad-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background var(--transition), transform var(--transition);
    }
    .card:hover .card-arrow { background: var(--grad); transform: scale(1.15); }
    .card-arrow svg { width: 14px; height: 14px; stroke: var(--teal); fill: none; }
    .card:hover .card-arrow svg { stroke: #fff; }

    /* ── Detail Page ── */
    #detail-page {
      display: none;
      animation: fadeIn .4s ease;
    }
    #detail-page.active { display: block; }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Nunito', sans-serif;
      font-size: .9rem;
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      margin-bottom: 32px;
      transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
      box-shadow: var(--shadow);
    }
    .back-btn:hover {
      border-color: var(--teal);
      box-shadow: 0 4px 20px rgba(43,196,180,.3);
    }
    .back-btn svg { width: 16px; height: 16px; stroke: var(--teal); fill: none; stroke-width: 2.5; }

    .detail-hero {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 40px;
      align-items: start;
    }
    @media (max-width: 860px) { .detail-hero { grid-template-columns: 1fr; } }

    .detail-img-wrap {
      border-radius: var(--radius);
      overflow: hidden;
      border: 3px solid transparent;
      background: var(--grad);
      padding: 3px;
      box-shadow: var(--shadow-lg);
    }
    .detail-img-wrap img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: calc(var(--radius) - 3px);
      display: block;
    }

    .detail-info-grid {
      display: grid;
      gap: 20px;
    }
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px;
      box-shadow: var(--shadow);
      transition: border-color var(--transition);
    }
    .info-card:hover { border-color: var(--teal); }
    .info-card h4 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.1rem;
      letter-spacing: .08em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .info-card ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .info-card ul li {
      font-size: .9rem;
      color: var(--text-muted);
      line-height: 1.5;
      padding-left: 18px;
      position: relative;
    }
    .info-card ul li::before {
      content: '›';
      position: absolute;
      left: 0;
      color: var(--teal);
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
    }
    .quick-tip {
      background: var(--grad);
      color: #fff;
      border-radius: var(--radius);
      padding: 16px 22px;
      font-size: .95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(62,207,142,.3);
    }
    .quick-tip span.bulb { font-size: 1.4rem; }

    /* ── Dark Mode Toggle ── */
    #theme-toggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--grad);
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(62,207,142,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      transition: transform var(--transition), box-shadow var(--transition);
      z-index: 100;
    }
    #theme-toggle:hover {
      transform: scale(1.12) rotate(15deg);
      box-shadow: 0 8px 32px rgba(62,207,142,.6);
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: fadeIn .45s ease both; }
    .card:nth-child(1)  { animation-delay: .05s; }
    .card:nth-child(2)  { animation-delay: .10s; }
    .card:nth-child(3)  { animation-delay: .15s; }
    .card:nth-child(4)  { animation-delay: .20s; }
    .card:nth-child(5)  { animation-delay: .25s; }
    .card:nth-child(6)  { animation-delay: .30s; }
    .card:nth-child(7)  { animation-delay: .35s; }
    .card:nth-child(8)  { animation-delay: .40s; }
    .card:nth-child(9)  { animation-delay: .45s; }
    .card:nth-child(10) { animation-delay: .50s; }
    .card:nth-child(11) { animation-delay: .55s; }
    .card:nth-child(12) { animation-delay: .60s; }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <h1>Smart Equipment<br>for Smart Health</h1>
  <p class="tagline">Explore Our Full Machine Collection</p>
  <div class="hero-wrapper">

</header>

<!-- ── MAIN ── -->
<main>

  <!-- HOME PAGE -->
  <div id="home-page">
    <div class="section-label">
      <h2>Our Machines</h2>
      <span class="line"></span>
    </div>

    <div class="equipment-grid" id="equipment-grid">
      <!-- Cards injected by JS -->
    </div>
  </div>

  <!-- DETAIL PAGE -->
  <div id="detail-page">
    <button class="back-btn" id="back-btn">
      <svg viewBox="0 0 24 24" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>

    <div id="detail-content"></div>

</main>

<!-- ── DARK MODE TOGGLE ── -->
<button id="theme-toggle" title="Toggle Dark Mode">🌙</button>

<script>
  /* ─────────── DATA ─────────── */
  const machines = [

      steps:    ['Step into the machine and position your shoulders under the pads.','Place your feet shoulder-width apart on the platform.','Keep your back flat against the support.','Release the safety handles.','Lower your body by bending your knees slowly.','Go down until your thighs are about parallel.','Push through your heels to return up.','Stop just before locking your knees.'],

        </div>
      </div>`;
    card.addEventListener('click', () => openDetail(m));
    grid.appendChild(card);
  });

  /* ─────────── DETAIL VIEW ─────────── */
  function openDetail(m) {
    const homePage   = document.getElementById('home-page');
    const detailPage = document.getElementById('detail-page');
    const content    = document.getElementById('detail-content');

    const toList = arr => arr.map(i => `<li>${i}</li>`).join('');

    content.innerHTML = `
      <div class="detail-hero">
        <div>
          <div class="detail-img-wrap">
            <img src="${m.img}" alt="${m.name}">
          </div>
        </div>
        <div class="detail-info-grid">
          <div class="info-card">
            <h4>Machine Name</h4>
            <ul><li>${m.name}</li></ul>
          </div>
          <div class="info-card">
            <h4>Target Muscles</h4>
            <ul>
              <li><strong>Primary:</strong> ${m.muscles.primary.join(', ')}</li>
              <li><strong>Secondary:</strong> ${m.muscles.secondary.join(', ')}</li>
            </ul>
          </div>
          <div class="quick-tip">
            <span class="bulb">💡</span>
            <span>${m.tip}</span>
          </div>
        </div>
      </div>

      <br>

      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:8px;">
        <div class="info-card">
          <h4>How to Use</h4>
          <ul>${toList(m.steps)}</ul>
        </div>
        <div class="info-card">
          <h4>Proper Form</h4>
          <ul>${toList(m.form)}</ul>
        </div>
        <div class="info-card">
          <h4>Common Mistakes</h4>
          <ul>${toList(m.mistakes)}</ul>
        </div>
      </div>`;

    homePage.style.display   = 'none';
    detailPage.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.getElementById('back-btn').addEventListener('click', () => {
    document.getElementById('home-page').style.display  = 'block';
    document.getElementById('detail-page').classList.remove('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ─────────── DARK MODE ─────────── */
  const toggle = document.getElementById('theme-toggle');
  toggle.addEventListener('click', () => {
    const html  = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    html.setAttribute('data-theme', isDark ? 'light' : 'dark');
    toggle.textContent = isDark ? '🌙' : '☀️';
  });

</script>

</var>
